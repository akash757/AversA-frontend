name: Deploy AversA Frontend to AWS

on:
  push:
    branches:
      - main

concurrency:
  group: aversa-frontend-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Verify & Build Frontend in CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js in CI (validates build before EC2 deploy)
        env:
          NEXT_PUBLIC_API_BASE_URL: "/api"
        run: npm run build

  deploy:
    name: Deploy Frontend to EC2
    needs: [test-and-build]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/AversA-frontend
            git pull origin main
            npm ci
            npm run build
            pm2 restart aversa-frontend
            sleep 3
            # Health check after restart - fail deploy if frontend does not answer
            curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:3000/ || (echo "Frontend health check failed!" && exit 1)
